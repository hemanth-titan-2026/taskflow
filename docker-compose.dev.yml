version: "3.9"

# Development override - use with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  app:
    build:
      target: build
    command: ["npx", "ts-node-dev", "--respawn", "--transpile-only", "src/index.ts"]
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug

  worker:
    build:
      target: build
    command: ["npx", "ts-node-dev", "--respawn", "--transpile-only", "src/workers/index.ts"]
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
